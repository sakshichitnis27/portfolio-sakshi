name: Deploy to External Public Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare Pages artifact and License
        run: |
          touch dist/.nojekyll
          echo "Copyright (c) 2026 Vismay Tiwari. All Rights Reserved." > dist/LICENSE
          echo "This repository contains the compiled static assets for my personal portfolio." >> dist/LICENSE
          echo "This code is NOT open source. You may not copy, reproduce, distribute, or create derivative works from this repository without explicit permission." >> dist/LICENSE


      - name: Push to Public Repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: vismaytiwari/portfolio
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
