name: Deploy to External Public Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare Pages artifact and License
        run: |
          touch dist/.nojekyll
          echo "Copyright (c) 2026 Vismay Tiwari. All Rights Reserved." > dist/LICENSE
          echo "This repository contains the compiled static assets for my personal portfolio." >> dist/LICENSE
          echo "This code is NOT open source. You may not copy, reproduce, distribute, or create derivative works from this repository without explicit permission." >> dist/LICENSE
          
          cat << 'EOF' > dist/README.md
          # Vismay Tiwari — Portfolio Output

          > **Hey there! Sorry for not sharing the original, un-minified code.** 

          This repository only contains the compiled static HTML, CSS, and minified JavaScript assets required to host the site on GitHub Pages. 

          The portfolio contains a lot of heavily customized mathematics and physics logic for the WebGL fluid field and 3D rendering that I prefer to keep closed-source. 

          If you like what you see and want something similar built, feel free to reach out to me! 🚀

          ---
          *Copyright (c) 2026 Vismay Tiwari. All Rights Reserved.*
          EOF

      - name: Push to Public Repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: vismaytiwari/portfolio
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
